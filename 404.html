<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the Map — Xynorash</title>
<meta name="description" content="This coordinate does not exist. Return to the Xynorash portfolio.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#05040c">
<link rel="icon" type="image/png" href="https://xynorash.github.io/xynorash/favicon.png">
<style>
:root{--bg:#05040c;--bg2:#150f30;--line:#2a2450;--fg:#efeaff;--dim:#9d8fd6;--cyan:#2de2ff;--mag:#e04bff;--cta-fg:#05040c;--pad:clamp(16px,3vw,56px)}
@media (prefers-color-scheme:light){:root{--bg:#f6f3ff;--bg2:#ebe5ff;--line:#cfc4f2;--fg:#120d2b;--dim:#5b3fd0;--cyan:#0a86a3;--mag:#9a14b8;--cta-fg:#f6f3ff}}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:var(--pad);color:var(--fg);font:400 17px/1.6 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  background:radial-gradient(60vw 60vh at 85% 0,color-mix(in srgb,var(--mag) 16%,transparent),transparent 70%),linear-gradient(to right,color-mix(in srgb,var(--dim) 12%,transparent) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(to bottom,color-mix(in srgb,var(--dim) 12%,transparent) 1px,transparent 1px) 0 0/64px 64px,var(--bg)}
body::before{content:"";position:fixed;inset:14px;border:1px solid var(--line);pointer-events:none}
.m{font:600 12px/1 ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.d{font:600 12px/1.6 ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 30px}
h1{font:700 clamp(64px,16vw,320px)/.9 'Space Grotesk',Inter,system-ui,sans-serif;letter-spacing:-.05em;background:linear-gradient(90deg,var(--cyan),var(--mag) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
p{font-size:clamp(18px,2vw,34px);max-width:36ch;margin:18px 0 32px;color:var(--fg)}
.b{display:inline-block;padding:18px 28px;background:var(--cyan);color:var(--cta-fg);font:600 14px/1 ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.b:hover,.b:focus-visible{outline:2px solid var(--mag);outline-offset:3px}
.l{margin-left:18px;color:var(--dim);font:600 14px/1 ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
.l:hover{color:var(--fg)}
</style>
</head>
<body>
<div class="m">XYNORASH / SIGNAL LOST</div>
<main>
  <h1>404</h1>
  <p>This coordinate is past the edge. Nothing lives here.</p>
  <a class="b" href="https://xynorash.github.io/xynorash/">Back to the portfolio</a><a class="l" href="https://xynorash.github.io/xynorash/ide/">Open the IDE</a>
</main>
<div class="d"><span><b>XYNORASH</b> &middot; NASH TEFISON</span><span>x unknown &middot; y unknown &middot; z past the edge</span></div>
</body>
</html>
