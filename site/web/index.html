<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nash Tefison (Xynorash) — portfolio: heaplens, xynovim, xyno-scholar, xynorash-pwsh.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="xynorash_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Xynorash — Xynorash</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background: #13161c; margin: 0; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      color: #4a5366; font: 13px monospace; z-index: 1;
    }
    #splash .bar {
      width: 160px; height: 3px; background: #242830; overflow: hidden;
      border-radius: 2px;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #ad523c; animation: slide 1s ease-in-out infinite alternate;
    }
    @keyframes slide { from { margin-left: 0 } to { margin-left: 60% } }
  </style>
</head>
<body>
  <div id="splash"><div>xynovim · loading buffers…</div><div class="bar"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
