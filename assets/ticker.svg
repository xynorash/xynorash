<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 44" width="900" height="44" role="img" aria-label="Rust, Dart, Flutter, Lua, PowerShell, Neovim, Arch, Hyprland"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05040c"/><stop offset=".6" stop-color="#150f30"/><stop offset="1" stop-color="#2a1d5a"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#907AD6" stop-opacity="0"/><stop offset=".5" stop-color="#c9b8ff"/><stop offset="1" stop-color="#907AD6" stop-opacity="0"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2de2ff"/><stop offset="1" stop-color="#e04bff"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#907AD6" stop-opacity=".5"/><stop offset="1" stop-color="#907AD6" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="blur28" x="-40%" y="-200%" width="180%" height="500%"><feGaussianBlur stdDeviation="28"/></filter>
<clipPath id="tc"><rect width="900" height="44" rx="10"/></clipPath><linearGradient id="fl2"><stop offset="0" stop-color="#05040c"/><stop offset="1" stop-color="#05040c" stop-opacity="0"/></linearGradient><linearGradient id="fr2"><stop offset="0" stop-color="#05040c" stop-opacity="0"/><stop offset="1" stop-color="#05040c"/></linearGradient></defs><style>
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}4%{opacity:1}14%{transform:translate(260px,110px);opacity:0}100%{opacity:0}}
.shoot{opacity:0;animation-name:shoot;animation-iteration-count:infinite;animation-timing-function:ease-in}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rv{transform:none!important}.sh{opacity:0!important}}
.w{font:500 12px 'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#9d8fd6;letter-spacing:3px;white-space:pre}.tk{animation:tick 28s linear infinite}@keyframes tick{to{transform:translateX(-1500px)}}</style><rect width="900" height="44" rx="10" fill="url(#bg)"/>
<g clip-path="url(#tc)"><g class="tk"><text x="0" y="27" class="w" textLength="1500" lengthAdjust="spacing">RUST  ◆  DART  ◆  FLUTTER  ◆  LUA  ◆  POWERSHELL  ◆  NEOVIM  ◆  ARCH  ◆  HYPRLAND  ◆  SYSTEMD  ◆  </text><text x="1500" y="27" class="w" textLength="1500" lengthAdjust="spacing">RUST  ◆  DART  ◆  FLUTTER  ◆  LUA  ◆  POWERSHELL  ◆  NEOVIM  ◆  ARCH  ◆  HYPRLAND  ◆  SYSTEMD  ◆  </text></g>
<rect width="120" height="44" fill="url(#fl2)"/><rect x="780" width="120" height="44" fill="url(#fr2)"/></g>
<rect x="30" y="42" width="840" height="1.6" fill="url(#edge)"/></svg>