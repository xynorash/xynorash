#cr{transform-box:fill-box;transform-origin:left;animation:grow 1.2s steps(18) .5s both}
.cur2{fill:#c9b8ff;animation:blink 1s steps(1) infinite,c2 6s steps(1) forwards}
@keyframes c2{0%{transform:translate(206px,61px)}30%{transform:translate(357px,61px)}100%{transform:translate(357px,61px)}}
