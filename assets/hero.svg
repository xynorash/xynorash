<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Every system has an edge. I like to stand on it, curious, and see what's past it.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07060f"/><stop offset=".6" stop-color="#14102b"/><stop offset="1" stop-color="#241a4a"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#907AD6" stop-opacity="0"/><stop offset=".5" stop-color="#c9b8ff"/><stop offset="1" stop-color="#907AD6" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#907AD6" stop-opacity=".55"/><stop offset="1" stop-color="#907AD6" stop-opacity="0"/></radialGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
<clipPath id="above"><rect width="900" height="262"/></clipPath>
<filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.rise{animation:rise 8s linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-200px);opacity:0}}
.halo{transform-origin:450px 252px;animation:halo 3.6s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.25);opacity:1}}
.sweep{animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-520px)}100%{transform:translateX(520px)}}
.bob{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ring{transform-origin:450px 246px;animation:ring 3.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.l{font:600 30px 'Fira Code','SF Mono',Menlo,Consolas,monospace;fill:url(#txt);opacity:0;animation:in 1.2s cubic-bezier(.2,.7,.2,1) forwards}
.l1{animation-delay:.3s}
.l2{font-size:19px;fill:#b9a8ff;animation-delay:1.5s}
.l3{font-size:19px;fill:#b9a8ff;animation-delay:2.4s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.l1{animation-name:in,breathe;animation-duration:1.2s,6s;animation-delay:.3s,1.5s;animation-iteration-count:1,infinite;animation-fill-mode:forwards,none}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.82}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.l{opacity:1}}
</style>
